[package]
name = "api_pep"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
calamine = "0.36.1"
csv = "1.4.0"
deunicode = "1.6.2"
encoding_rs = "0.8.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
strsim = "0.11.1"
tokio = { version = "1.53.1", features = ["full"] }
